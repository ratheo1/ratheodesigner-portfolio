<!doctype html>
<html lang="fr" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!--Navbar-->
    <nav class="relative bg-black px-6 py-6 text-white md:px-10 lg:px-30 lg:py-8">

        <div class="grid grid-cols-3 items-center">

            <!-- Menu Desktop -->
            <div class="hidden items-center gap-5 lg:flex xl:gap-7">
                <a href="/#work" class="text-base transition-opacity hover:opacity-60">
                    Projets
                </a>
                <a href="/#about" class="text-base transition-opacity hover:opacity-60">
                    À propos
                </a>
                <a href="/#services" class="text-base transition-opacity hover:opacity-60">
                    Services
                </a>
                <a href="/#contact" class="text-base transition-opacity hover:opacity-60">
                    Contact
                </a>
                <a href="https://creativemockup.store" target="_blank"
                    class="text-base transition-opacity hover:opacity-60">
                    Store
                </a>
            </div>

            <!-- Bouton Menu Mobile -->
            <div class="flex lg:hidden">
                <button id="menu-button" type="button" aria-label="Ouvrir le menu" aria-expanded="false"
                    class="flex items-center gap-2 text-sm">
                    <span class="flex flex-col gap-1">
                        <span class="block h-px w-5 bg-white"></span>
                        <span class="block h-px w-5 bg-white"></span>
                    </span>
                </button>
            </div>

            <!-- Logo centré -->
            <div class="flex justify-center">
                <a href="/" class="block">
                    <img class="w-20 md:w-24" src="../images/Logo_ratheo.png" alt="Logo Ratheo">
                </a>
            </div>

            <!-- Bouton Contact Desktop -->
            <div class="hidden items-center justify-end lg:flex">
                <a href="#contact"
                    class="rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition-all duration-300 hover:bg-white/80">
                    Contact
                </a>
            </div>

            <!-- Bouton Contact Mobile -->
            <div class="flex items-center justify-end lg:hidden">
                <!-- Bouton Contact mobile -->
                <a href="#contact" aria-label="Contact"
                    class="ml-auto flex h-10 w-10 items-center justify-center rounded-full bg-white text-black transition-transform duration-300 hover:scale-105 md:hidden">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 19L19 5"></path>
                        <path d="M9 5h10v10"></path>
                    </svg>
                </a>
            </div>

        </div>

        <!-- Menu Mobile -->
        <div id="mobile-menu" class="hidden border-t border-white/10 pt-6 lg:hidden">
            <div class="flex flex-col gap-5">
                <a href="#work" class="text-2xl">Travail</a>
                <a href="#about" class="text-2xl">À propos</a>
                <a href="#services" class="text-2xl">Services</a>
                <a href="#contact" class="text-2xl">Contact</a>
                <a href="#" class="text-2xl">Store</a>
            </div>
        </div>

    </nav>

    <main>
        <!-- =========================
             HERO SERVICE
        ========================== -->
        <section class="px-6 pb-10 pt-10 md:px-10 md:pb-20 md:pt-20 lg:px-24">
            <div class="mx-auto max-w-7xl">

                <!-- Numéro -->
                <p class="mb-8 text-xs uppercase tracking-[0.2em] text-white/40">
                    Service — <span id="service-number"></span>
                </p>

                <div class="grid gap-12 lg:grid-cols-[1fr_300px] lg:items-end lg:gap-20">

                    <!-- Nom et description -->
                    <div>
                        <h1 id="service-title"
                            class="max-w-5xl text-3xl font-medium leading-[0.95] tracking-[-0.05em] md:text-4xl lg:text-6xl">
                        </h1>

                        <p id="service-description"
                            class="mt-10 max-w-3xl text-sm leading-relaxed text-white/55 md:text-base"></p>
                    </div>

                    <!-- Prix -->
                    <div class="pt-5 lg:mb-2">
                        <p class="mb-3 text-xs uppercase tracking-[0.2em] text-white/40">
                            Prix
                        </p>

                        <p id="service-price" class="text-xl font-medium text-white md:text-2xl"></p>
                    </div>

                </div>

            </div>
        </section>

        <!-- Image de présentation -->
        <section class="px-6 pb-10 pt-6 md:px-10 lg:px-24 lg:pb-20 lg:pt-10">
            <div class="mx-auto max-w-7xl">
                <div class="overflow-hidden bg-white/5">
                    <img id="service-image" src="" alt="" class="h-full w-full object-cover">
                </div>
            </div>
        </section>


        <!-- =========================
             DETAILS DE L'OFFRE
        ========================== -->
        <section class="px-6 py-10 md:px-10 md:py-20 lg:px-24">
            <div class="mx-auto grid max-w-7xl gap-14 md:grid-cols-[240px_1fr] lg:grid-cols-[260px_1fr] lg:gap-28">

                <!-- Label -->
                <div>
                    <p class="text-xs uppercase tracking-[0.2em] text-white/40">
                        Détails de l'offre
                    </p>
                </div>

                <!-- Informations -->
                <div class="max-w-4xl">

                    <h2 class="mb-10 text-2xl font-medium tracking-tight md:text-3xl">
                        Ce qui est inclus
                    </h2>

                    <ul id="service-included" class="border-t border-white/15"></ul>

                    <!-- Délai -->
                    <div class="mt-5 grid gap-5 pt-6 sm:grid-cols-2">

                        <p class="text-xs uppercase tracking-[0.2em] text-white/40">
                            Délai de réalisation
                        </p>

                        <p id="service-deadline" class="text-sm text-white/80 md:text-base"></p>

                    </div>

                </div>

            </div>
        </section>

        <!-- Section CTA -->
        <section class="bg-white px-6 py-20 text-black md:px-10 lg:px-24 lg:py-28">
            <div class="mx-auto flex max-w-7xl flex-col items-start justify-between gap-8 md:flex-row md:items-center">
                <div class="max-w-xl">
                    <p class="mb-4 text-sm uppercase tracking-[0.2em] text-black/40">
                        Prêt à donner vie à votre projet ?
                    </p>

                    <h2 id="service-cta-title" class="text-3xl font-medium tracking-tight md:text-5xl"></h2>

                    <p id="service-cta-description"
                        class="mt-5 max-w-lg text-base leading-relaxed text-black/60 md:text-lg"></p>
                </div>

                <a href="../index.html#contact"
                    class="inline-flex shrink-0 items-center justify-center bg-black px-7 py-4 text-sm text-white transition-colors duration-300 hover:bg-black/80 rounded-full">
                    Demander un devis
                    <span class="ml-4 text-lg leading-none">↗</span>
                </a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-black px-6 py-10 text-white md:px-10 lg:px-24">
        <div class="mx-auto grid grid-cols-1 items-center gap-7 sm:grid-cols-3 sm:gap-0">

            <!-- Copyright -->
            <div class="justify-self-center sm:justify-self-start">
                <p class="text-center text-xs text-white/40 sm:text-left sm:text-sm">
                    © 2026 Rathéo. Tous droits réservés.
                </p>
            </div>

            <!-- Réseaux sociaux -->
            <div class="flex items-center justify-center gap-5 text-lg text-white/50">

                <!-- Instagram -->
                <a href="https://www.instagram.com/ratheodesign/" aria-label="Instagram" target="_blank"
                    rel="noopener noreferrer" class="transition-colors duration-300 hover:text-white">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <!-- TikTok -->
                <a href="https://www.tiktok.com/@ratheodesign" aria-label="TikTok" target="_blank"
                    rel="noopener noreferrer" class="transition-colors duration-300 hover:text-white">
                    <i class="fa-brands fa-tiktok"></i>
                </a>

                <!-- YouTube -->
                <a href="https://www.youtube.com/@ratheodesign" aria-label="YouTube" target="_blank"
                    rel="noopener noreferrer" class="transition-colors duration-300 hover:text-white">
                    <i class="fa-brands fa-youtube"></i>
                </a>

                <!-- Pinterest -->
                <a href="https://www.pinterest.com/ratheodesigner/" aria-label="Pinterest" target="_blank"
                    rel="noopener noreferrer" class="transition-colors duration-300 hover:text-white">
                    <i class="fa-brands fa-pinterest-p"></i>
                </a>

            </div>

            <!-- Retour en haut -->
            <div class="justify-self-center sm:justify-self-end">
                <a href="#" class="text-xs text-white/40 transition-colors duration-300 hover:text-white sm:text-sm">
                    Retour en haut ↑
                </a>
            </div>

        </div>
    </footer>

    <script src="../js/menu_responsive.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/service_detail.js"></script>
</body>

</html>
