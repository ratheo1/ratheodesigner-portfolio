<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="description" content="Découvrez ce projet de design graphique réalisé par Rathéo Design.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">
</head>

<body id="top" class="bg-black text-white antialiased">

    <!-- Navbar -->
    <nav class="relative bg-black px-6 py-6 text-white md:px-10 lg:px-30 lg:py-8">

        <div class="grid grid-cols-3 items-center">

            <!-- Menu Desktop -->
            <div class="hidden items-center gap-5 lg:flex xl:gap-7">
                <a href="/#work" class="text-base transition-opacity hover:opacity-60">
                    Projets
                </a>
                <a href="/#about" class="text-base transition-opacity hover:opacity-60">
                    À propos
                </a>
                <a href="/#services" class="text-base transition-opacity hover:opacity-60">
                    Services
                </a>
                <a href="/#contact" class="text-base transition-opacity hover:opacity-60">
                    Contact
                </a>
                <a href="https://creativemockup.store" target="_blank"
                    class="text-base transition-opacity hover:opacity-60">
                    Store
                </a>
            </div>

            <!-- Bouton Menu Mobile -->
            <div class="flex lg:hidden">
                <button id="menu-button" type="button" aria-label="Ouvrir le menu" aria-expanded="false"
                    class="flex items-center gap-2 text-sm">
                    <span class="flex flex-col gap-1">
                        <span class="block h-px w-5 bg-white"></span>
                        <span class="block h-px w-5 bg-white"></span>
                    </span>
                </button>
            </div>

            <!-- Logo centré -->
            <div class="flex justify-center">
                <a href="/" class="block">
                    <img class="w-20 md:w-24" src="../images/Logo_ratheo.png" alt="Logo Ratheo">
                </a>
            </div>

            <!-- Bouton Contact Desktop -->
            <div class="hidden items-center justify-end lg:flex">
                <a href="#contact"
                    class="rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition-all duration-300 hover:bg-white/80">
                    Contact
                </a>
            </div>

            <!-- Bouton Contact Mobile -->
            <div class="flex items-center justify-end lg:hidden">
                <!-- Bouton Contact mobile -->
                <a href="#contact" aria-label="Contact"
                    class="ml-auto flex h-10 w-10 items-center justify-center rounded-full bg-white text-black transition-transform duration-300 hover:scale-105 md:hidden">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 19L19 5"></path>
                        <path d="M9 5h10v10"></path>
                    </svg>
                </a>
            </div>

        </div>

        <!-- Menu Mobile -->
        <div id="mobile-menu" class="hidden border-t border-white/10 pt-6 lg:hidden">
            <div class="flex flex-col gap-5">
                <a href="#work" class="text-2xl">Travail</a>
                <a href="#about" class="text-2xl">À propos</a>
                <a href="#services" class="text-2xl">Services</a>
                <a href="#contact" class="text-2xl">Contact</a>
                <a href="#" class="text-2xl">Store</a>
            </div>
        </div>

    </nav>

    <main>

        <!-- Image principale -->
        <section class="px-6 py-10 md:px-10 lg:px-24">
            <div class="mx-auto max-w-7xl">

                <div class="aspect-[16/9] overflow-hidden bg-white/5">
                    <img id="project-cover" src="" alt="" class="h-full w-full object-cover object-center">
                </div>

            </div>
        </section>


        <!-- Introduction du projet -->
        <section class="px-6 pb-16 md:px-10 md:pb-24 md:pt-10 lg:px-24">
            <div class="mx-auto max-w-7xl">

                <div class="mb-8 flex items-center gap-4 text-xs uppercase tracking-[0.2em] text-white/40">
                    <span id="project-category"></span>
                    <span>—</span>
                    <span id="project-year"></span>
                </div>

                <h1 id="project-title"
                    class="max-w-6xl text-2xl font-medium leading-[0.95] tracking-[-0.05em] md:text-7xl lg:text-5xl">
                </h1>

                <div id="project-description" class="mt-8 max-w-2xl text-sm leading-relaxed text-white/50 md:text-base">
                </div>

            </div>
        </section>


        <!-- Galerie -->
        <section class="px-6 pb-10 md:px-10 md:pb-20 lg:px-24">
            <div id="project-gallery" class="mx-auto grid max-w-7xl grid-cols-1 gap-6">
            </div>
        </section>

        <!-- Livrables -->
        <section class="px-6 pb-10 md:px-10 md:pb-24 lg:px-24">
            <div class="mx-auto max-w-7xl pt-8">

                <div class="flex flex-col justify-between gap-6 md:flex-row md:items-start">

                    <!-- Titre -->
                    <div>
                        <p class="text-xs uppercase tracking-[0.2em] text-white/40">
                            Livrables
                        </p>
                    </div>

                    <!-- Contenu -->
                    <div>
                        <p id="project-deliverables"
                            class="max-w-xl text-sm leading-relaxed text-white/60 md:text-base">
                        </p>
                    </div>

                </div>

            </div>
        </section>


        <!-- Explorer d'autres projets -->
        <section class="px-6 pb-24 md:px-10 md:pb-32 lg:px-24">
            <div
                class="mx-auto flex max-w-7xl flex-col items-start justify-between gap-8 border-t border-white/10 pt-8 md:flex-row md:items-center">

                <div class="lg:w-1/2">
                    <p class="text-sm text-white/40">Prêt à donner vie à votre projet ?</p>
                    <h2 class="mt-2 text-2xl font-medium tracking-tight text-white md:text-3xl">
                        Parlons de votre projet et construisons une solution qui vous ressemble.
                    </h2>
                </div>

                <a href="../index.html#contact"
                    class="inline-flex items-center justify-center rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition hover:bg-white/80">
                    Me contacter
                </a>

            </div>
        </section>

    </main>

    <script src="../js/project.js"></script>
    <script src="../js/menu_responsive.js"></script>

    <!-- Footer -->
    <footer class="bg-black px-6 py-10 text-white md:px-10 lg:px-24">
        <div class="mx-auto grid grid-cols-1 items-center gap-7 sm:grid-cols-3 sm:gap-0">

            <!-- Copyright -->
            <div class="justify-self-center sm:justify-self-start">
                <p class="text-center text-xs text-white/40 sm:text-left sm:text-sm">
                    © 2026 Rathéo. Tous droits réservés.
                </p>
            </div>

            <!-- Réseaux sociaux -->
            <div class="flex items-center justify-center gap-5 text-lg text-white/50">

                <!-- Instagram -->
                <a href="#" aria-label="Instagram" target="_blank" rel="noopener noreferrer"
                    class="transition-colors duration-300 hover:text-white">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <!-- TikTok -->
                <a href="#" aria-label="TikTok" target="_blank" rel="noopener noreferrer"
                    class="transition-colors duration-300 hover:text-white">
                    <i class="fa-brands fa-tiktok"></i>
                </a>

                <!-- YouTube -->
                <a href="#" aria-label="YouTube" target="_blank" rel="noopener noreferrer"
                    class="transition-colors duration-300 hover:text-white">
                    <i class="fa-brands fa-youtube"></i>
                </a>

                <!-- Pinterest -->
                <a href="#" aria-label="Pinterest" target="_blank" rel="noopener noreferrer"
                    class="transition-colors duration-300 hover:text-white">
                    <i class="fa-brands fa-pinterest-p"></i>
                </a>

            </div>

            <!-- Retour en haut -->
            <div class="justify-self-center sm:justify-self-end">
                <a href="#" class="text-xs text-white/40 transition-colors duration-300 hover:text-white sm:text-sm">
                    Retour en haut ↑
                </a>
            </div>

        </div>
    </footer>

</body>

</html>
